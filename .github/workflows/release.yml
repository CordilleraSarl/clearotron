      # after this run began — that is the whole point of the wait — so a default checkout would pack
      # the bytes of the previous version and publish them under the new number. But `main` is a NAME,
      # and between the wait's last read and this checkout it can move on to a commit that changes no
      # version: an instrument fix with no note passes the tip check below untouched, because that check
      # compares VERSIONS. Naming the commit is what makes the two ends talk about one tree. tracker
      # issue 238.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.awaited.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

