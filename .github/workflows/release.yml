      # registry is a worse lie than a publish that is not yet tagged, and this order means the failure
      # leaves the tag unwritten rather than pointing at nothing.
      # A PRE-RELEASE IS TAGGED AND GETS A PRE-RELEASE ENTRY (owner's ruling 2026-09-07, tracker issue
      # 264, reversing his 2026-09-06 ruling that it should get none). The objection that ruling was
      # made on — one entry per beta buries the stable somebody came for — is answered by the flag
      # rather than by silence: GitHub shows the latest NON-prerelease as the release, and marked
      # pre-releases sit under it. That is what openclaw's page does with 240 entries on it, which is
      # the practice this was aligned to.
      #
      # The TAG still has to land first: `release-cut-decision.mjs` reads tags to decide whether a
      # version is already published, so a beta with no tag is a version this pipeline would cut again,
      # and again. `pre exit` folds the betas into the stable, and the stable keeps its own entry.
      - name: Tag it, and say what changed
        if: steps.what.outputs.dry_flag == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.what.outputs.version }}
          PRERELEASE_FLAG: ${{ steps.what.outputs.prerelease }}
        run: |
          set -euo pipefail
          TARGET="$GITHUB_SHA"
          # Read from the VERSION above, never from the channel — see the step that computed it.
          if [ "$PRERELEASE_FLAG" = "true" ]; then
            # THE EXACT REF, NOT A PREFIX. Measured on this repository, 2026-09-06:
            # `git/matching-refs/tags/v0.1.1` answers with six refs — v0.1.1, v0.1.1-beta.0,
            # v0.1.1-beta.1, v0.1.10, v0.1.11, v0.1.12 — so a prefix read would report the stable
            # that follows a beta as already tagged and it would never get a tag of its own.
            # `git/ref/tags/v0.1.11` answers with that one ref and `git/ref/tags/v0.1` is a 404, so
            # the singular read is exact. The answer is still compared in full, because this step
            # should not rest on that distinction holding.
            EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --jq '.ref' 2>/dev/null || true)
