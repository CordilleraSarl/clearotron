            echo "::error::The wait reported a ${#AWAITED_SHA}-character ref rather than a full commit. An abbreviated or moving name is what let this job publish a different tree from the one it decided about."
            exit 2
          fi
          echo "Publishing the commit this run awaited: $AWAITED_SHA"

