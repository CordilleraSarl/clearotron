      # directory, and npm's failure for a missing one reads like a packing failure rather than a missing
      # folder. The seal below is inside the "once": it rewrites the manifest in place, before anything
      # scans or measures the artefact, so every step after it reads the bytes that go to the registry.
      - name: Pack the exact bytes that will be published
