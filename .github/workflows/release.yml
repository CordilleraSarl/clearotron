      # fail — it checks out the default branch — so an absent answer here would publish `main` while
      # every log line said it published the commit this run awaited. That is the defect this job
      # already had, wearing the name of its fix.
      - name: The wait named a commit to publish
        env:
          AWAITED_SHA: ${{ needs.awaited.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "$AWAITED_SHA" ]; then
            echo "::error::The wait reported no commit, so there is nothing to check out. That is a failure to LOOK, not a finding that nothing merged, and checking out the branch name instead would ship a tree this run never decided about."
            exit 2
          fi
          case "$AWAITED_SHA" in
            *[!0-9a-f]*) echo "::error::The wait reported \"$AWAITED_SHA\", which is not a commit."; exit 2 ;;
          esac
