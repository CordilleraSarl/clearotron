#
# tracker issue 97 — a merged pull request becomes a release without anybody typing commands on a laptop.
#
# TWO ACTS, AND ONLY ONE OF THEM IS A PERSON'S. Every user-visible pull request leaves a note in
# `.changeset/`. This workflow keeps a standing pull request that turns those notes into the next version
# number and the plain-English changelog; merging it is the act of cutting a release. Everything after
# the merge — the tag, the GitHub release, the publish to npm — happens here.
#
# WHO PERFORMS THAT ACT DEPENDS ON THE CHANNEL. A beta is a maintainer's call, dispatched on demand. A
# stable is the owner's word: it exits pre mode and goes to `latest` (tracker issue 230, unchanged).
#
# HOW IT PUBLISHES, AND WHY THERE IS NO TOKEN. npm Trusted Publishing: the registry is configured to
# trust this repository, this workflow file, and the `npm` environment, and npm exchanges the run's OIDC
# token for a short-lived credential at publish time. Nothing long-lived exists to leak, and the package
# carries provenance a reader can check back to the commit that produced it. `release-publish-guard.mjs`
# runs before anything else and refuses if a credential, a registry to authenticate against, or a
# publish without provenance ever appears here. The workflow FILENAME and the ENVIRONMENT NAME are part
# of the registry's configuration — renaming either makes the registry refuse the publish.
#
# (This replaces the private repository's version, which could not publish at all: publishing was a human
# act under the owner's 2026-08-26 ruling. Two rulings moved it — 2026-09-04, tag-triggered publish from
# CI approved; 2026-09-05, Trusted Publishing configured for this repository.)
#
# WHAT FIRES THE PUBLISH, AND WHAT NO LONGER DOES (tracker issue 264, owner's ruling 2026-09-07).
# A MERGE PUBLISHES NOTHING. A beta is cut on demand, by a maintainer, at the natural points — after a
# bundle lands that a tester should see, or while a stable is being prepared — days apart, never hours.
# That is `workflow_dispatch` with `cut: beta`. Everything else fires a publish exactly as before: a tag
# pushed by a person, and the cron underneath.
#
# WHY THE CADENCE CHANGED. Every merge used to cut and publish a beta, because this job turned on
# auto-merge for the version pull request on every push. Measured against openclaw on 2026-09-07 — 252
# npm versions, 240 GitHub releases, and betas before each stable running 2, 0, 0, 5, 10, 0, 1, 0 — the
# difference between us and the practice we align to was never the naming or the tags. It was the
# cadence: they cut deliberately, days apart, while a release is being prepared.
#
# THE PUBLISH STILL RUNS IN THE SAME RUN THAT CUT THE VERSION. It is deliberately NOT "the tag the
# release step creates": a tag pushed with the built-in GITHUB_TOKEN starts no new workflow run, so a
# pipeline that waited for one would cut versions forever and never publish.
#
# `workflow_dispatch` WITHOUT `cut: beta` IS STILL THE REHEARSAL and still cannot publish: the publish
# step runs `--dry-run` on that input, from any branch. A dispatched CUT is held to `main` by the branch
# check in the same step, because it can publish.
name: Release

on:
  # A TAG PUSH IS NOT A PUBLISH PATH, AND MUST NOT BECOME ONE AGAIN (tracker issue 264).
  #
  # `tags: ['v*']` was here until 2026-09-07 and it made pushing a tag publish the version at it. That is
  # dangerous in this pipeline specifically, because TAGS ARE ALSO ITS MEMORY: `release-cut-decision.mjs`
  # decides whether a version has been released by asking whether its tag exists. Restoring a deleted tag
  # — putting a fact back — therefore ATTEMPTED A RELEASE.
  #
  # That is not hypothetical. On 2026-09-07 three tags were deleted by hand while the manifest still named
  # the newest of them, which left the pipeline reading that version as never released. Recreating the
  # three tags fixed that and started three real publish runs, one per tag. All three built the package,
  # passed every guard, and were stopped by the registry alone: "Cannot publish over previously published
  # version". The registry refused because those versions had just been unpublished — timing, not a guard
  # of ours. Had the versions still been live, the publishes would have succeeded.
  #
  # There is nothing left for the trigger to do. A release is cut on demand by dispatch, and the cron
  # underneath catches a cut whose wait gave up. Both are in the same file, below.
  push:
    branches: [main]
  # WHY A CRON IS HERE, AND WHY DELETING IT STOPS EVERY RELEASE. The version pull request merges itself,
  # and GitHub performs that merge with the built-in `GITHUB_TOKEN` — a push made with that token starts
  # NO workflow run. So the merge that cuts the version fires nothing at all: no CI, no release, no
  # error. Measured here 2026-09-05 on commit `65e634a6`, with five Dependabot runs arriving on the same
  # commit within seconds as the control — the suppression is on the token, not on the repository.
  #
  # This is the same rule the tag paragraph below names, one step earlier, and there is no way round it
  # that this design permits: the alternative is an app or personal credential in the repository, which
  # is the one thing the publishing design forbids. So nothing waits for that push. Every five minutes,
  # `pending` asks main a question instead — is there a version here with no tag — and answers it with
  # the same function the push path uses.
  #
  # IT FIRES, AND IT IS NOT PUNCTUAL. First scheduled run on this repository: 33973623236, 2026-09-05
  # 15:03:15Z, success — after several hours of nothing, with the trigger present on `main` the whole
  # time. Then nothing again for the next hour, through twelve intervals it should have taken.
  #
  # So treat this as a floor, not a clock. `*/5` on a public repository is what GitHub feels like giving
  # you; a version sitting cut and unpublished may wait an hour for it.
  #
  # AND THE NET HAS NOT CAUGHT ANYTHING YET. Two stable releases have gone out and NEITHER was published
  # by this cron: 0.1.1 by a merge of an unrelated pull request at 16:17Z, 0.1.2 by another at 17:14Z.
  # Both times the cut sat on main until somebody pushed with their own credentials, and both times the
  # publish then worked first try. The cron's whole record on 2026-09-05 is one run, 33973623236 at
  # 15:03:15Z, which found nothing to do.
  #
  # THAT DESCRIPTION USED TO END HERE, AND IT ENDED BADLY: three acts, two of them a person's — a merge
  # opens the version pull request, somebody approves its parked run, and somebody's NEXT push to main is
  # what publishes it. Two stable releases went out that way and neither was published by this cron.
  #
  # WHAT CLOSED IT (tracker issue 208) is in the `version` job, not here: the human push that opens the
  # version pull request now stays alive and watches main for that pull request to merge, then publishes
  # it. The waiting run is the one a person started, which is the only run this design can be sure will
  # exist — see the note on that step for the attempt that failed first and why.
  #
  # THIS CRON REMAINS THE FLOOR UNDER ALL OF IT, and deleting it is still how every release stops. It
  # catches what the wait gives up on: a version branch whose checks went red and merged an hour later, a
  # run cancelled mid-wait, anything that merges outside the fifteen minutes.
  #
  # IT DOES NOT CUT ANYTHING, AND THAT IS WHY IT SURVIVES tracker issue 264's "no scheduled beta". This
  # asks main one question — is there a version here with no tag — and a version only reaches main when a
  # dispatched cut merged the version pull request. With no cut dispatched there is nothing for it to
  # find, which is the acceptance criterion "a night with no cut publishes nothing" holding by
  # construction rather than by a second switch.
  schedule:
    - cron: '*/5 * * * *'
  #
  # `workflow_dispatch` IS HOW A BETA IS CUT (tracker issue 264, owner's ruling 2026-09-07), and it is
  # still the rehearsal. Two modes, and the default is the old behaviour: `rehearse` dry-runs everything
  # exactly as before, `beta` cuts one pre-release on demand. Nothing publishes on a merge any more, so
  # this input is the only thing that starts a release during the pre-release phase.
  workflow_dispatch:
    inputs:
      cut:
        description: Rehearse the pipeline, cut one beta, or cut the stable
        type: choice
        default: rehearse
        options:
          - rehearse
          - beta
          - stable

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The same pin as ci.yml, and it has to be: the release job packs the artefact a user installs, so
  # building it on a Node the suite was never run against ships something verified on one runtime and
  # produced on another.
  NODE_VERSION: '22.23.2'
  # Trusted publishing needs npm 11.5.1 or newer, and Node 22 ships npm 10. Pinned rather than `@latest`
  # so a release is reproducible; raise it deliberately.
  NPM_VERSION: '12.0.2'
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

jobs:
  version:
    name: Open the version pull request, or cut the beta this dispatch asked for
    # A PUSH KEEPS THE VERSION PULL REQUEST CURRENT; A DISPATCH IS WHAT MERGES IT (tracker issue 264).
    # Both events run this job and they leave by different doors: the push updates the standing pull
    # request and stops there, the `beta` dispatch updates it and then turns on auto-merge. The rehearsal
    # does not reach this job at all, which is what it has always done.
    if: >-
      github.repository == 'CordilleraSarl/clearotron'
      && ((github.event_name == 'push' && github.ref == 'refs/heads/main')
          || (github.event_name == 'workflow_dispatch' && inputs.cut != 'rehearse'
              && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    # 15 OF THESE MINUTES CAN BE THE WAIT BELOW (tracker issue 208), so this is not the 20 it was: a
    # budget that cannot contain its own longest step cancels the job at the moment it was about to
    # publish, and a cancelled job reads as neither a success nor a failure to anybody scanning runs.
    timeout-minutes: 30
    permissions:
      contents: write         # the version commit
      pull-requests: write    # the standing version pull request
      # SPELLING OUT ANY PERMISSION SETS EVERY OTHER ONE TO `none`, so these two are not decoration:
      # without them the step that asks whether the version pull request's checks started gets a 403 from
      # both endpoints it reads. `checks: read` is `commits/{sha}/check-runs`; `actions: read` is
      # `actions/runs`, which is the only surface that carries `action_required`.
      checks: read
      actions: write    # dispatches CI on the version branch, so its checks need no approval
      #
      # THERE IS NO `administration: read` HERE AND THERE CANNOT BE. The guard reads the repository's
      # current fork-pull-request approval policy so it can NAME the setting rather than quote a
      # remembered one — and that endpoint wants repository-administration scope, which is not one of the
      # permissions a job may request. Adding it does not fail the job: GitHub refuses to PARSE THE WHOLE
      # WORKFLOW, and says so as a run named after this file with no jobs and no log. Measured
      # 2026-09-05, on a branch, which is the only reason it was not measured on main with the release
      # stopped and nothing legible to say why.
      #
      # So the policy read is best-effort by design. It fails soft and the finding says the policy could
      # not be read from here and names it as the setting to look at, which is still better than a value
      # this file remembers and the repository has changed.
    # `cut` answers about the version THIS PUSH found on main — a version cut earlier and never
    # published, or the one this push's own merge carried. `pr_number` names the version pull request
    # this push opened or updated, which is a DIFFERENT version and is published by its own job below.
    #
    # THE WAIT USED TO LIVE IN THIS JOB AND COULD NOT ARM. It was conditioned on `cut != true`, so on any
    # push that both published a stranded version and cut a new one it was skipped — and that is the
    # ordinary rhythm, not an edge: a version pull request self-merges (firing nothing), the next push
    # publishes it and cuts another, and the wait is skipped again every single time. Measured three
    # times on 2026-09-06. It is its own job now, and it arms whenever a pull request was cut.
    outputs:
      cut: ${{ steps.cut.outputs.cut }}
      version: ${{ steps.cut.outputs.version }}
      pr_number: ${{ steps.changesets.outputs.pr-number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0      # tags included: the cut decision below reads them

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci

      - name: This pipeline publishes only the way it was authorised to
        run: node scripts/release-publish-guard.mjs

      # BEFORE THE VERSION STEP, because after it the notes are gone. `changeset version` consumes them
      # into the changelog; a note that should never have been written is then a line in a file a customer
      # reads, and taking it out means rewriting a published release. The owner's contract is in
      # `.changeset/README.md`; this is the half that cannot be forgotten.
      - name: Every release note is written for the person who reads it
        run: node scripts/release-notes-lint.mjs

      # `version:` is our wrapper, and it is not optional: `changeset version` moves the four WORKSPACE
      # packages and leaves the root package — `clearotron`, the one thing a user installs — where it
      # was. The wrapper carries the number to the root, assembles the one changelog a reader opens, and
      # refuses if a line of it is not plain English.
      #
      # `publish:` is absent because changesets publishes workspace packages, and the artefact is the
      # root package, which is not one of them. Publishing is the job below.
      # @v2, AND THE VERSION IS THE WHOLE POINT OF THIS STEP. `@v1` decides which release notes a
      # pre-release has already consumed by reading `preState.changesets` — a key `@changesets/cli@3.0.1`
      # NO LONGER WRITES. Its `enterPre` writes `{mode, tag}` and nothing else, and its `migratePreState`
      # deletes that key and MOVES the consumed notes into `.changeset/pre/`. So on the first push after a
      # pre-release cut, `@v1` finds seven notes it believes are still pending and its reader treats the
      # leftover `.changeset/pre/` directory as an old-format changeset, opening a `changes.md` that has
      # never existed there. Measured here 2026-09-05: the version job died on that ENOENT and took the
      # publish with it.
      #
      # `@v2` does it the new way — `changesets.filter(c => !c.id.startsWith("pre/"))` — so the consumed
      # notes are recognised as consumed and the run reaches the cut decision. Nothing in `.changeset/`
      # needs repairing; the state there is what the tool wrote and is current.
      #
      # THE OUTPUT AND THE INPUTS ARE RENAMED WITH IT. `pullRequestNumber` is `pr-number`, and the inputs
      # take their new spellings; @v2 shims the old input names, which is exactly why using them would
      # leave the next reader thinking the version did not matter. `push-with-git-cli: true` keeps @v1's
      # behaviour rather than taking @v2's new default, because one variable moves at a time.
      # ── THE INPUT DECIDES THE CHANNEL, AND THE CHANNEL IS PRE MODE (tracker issue 279) ──────────────
      #
      # The channel is derived from the VERSION, and the version is decided by whether `.changeset/pre.json`
      # says this tree is in pre-release mode when `changeset version` runs. So the input has to put the
      # tree in the right mode before that, or the label on the button and the artefact disagree.
      #
      # THIS IS NOT HYPOTHETICAL AND IT POINTED THE DANGEROUS WAY. After the 0.2.1 stable, `pre.json` was
      # not left saying "exit" — `changeset version` DELETED it. A `cut: beta` dispatch in that state would
      # have computed a stable version and published it to `latest`: a stable release out of a button
      # marked beta, with nothing in the run saying so.
      #
      # Both directions are idempotent by construction: entering pre when already in it, or exiting when
      # already out, is a no-op here rather than an error, because the state a cut needs is a fact about
      # the tree and not about what the last cut happened to do.
      - name: Put the tree in the mode this cut needs
        if: github.event_name == 'workflow_dispatch' && inputs.cut != 'rehearse'
        run: |
          set -euo pipefail
          mode=$(node -p "try{require('./.changeset/pre.json').mode}catch(e){'none'}")
          echo "pre-release mode before this cut: $mode"
          if [ "${{ inputs.cut }}" = "beta" ]; then
            if [ "$mode" != "pre" ]; then
              npx changeset pre enter beta
              echo "entered pre-release mode with tag beta"
            else
              echo "already in pre-release mode — nothing to do"
            fi
          else
            if [ "$mode" = "pre" ]; then
              npx changeset pre exit
              echo "left pre-release mode"
            else
              echo "not in pre-release mode — nothing to do"
            fi
          fi

      - name: Open or update the standing version pull request
        id: changesets
        # PINNED TO A COMMIT, because `v1` and `v2` are BRANCHES here, not tags — there is no tag `v1`
        # at all (measured 2026-09-05), so `@v2` is whatever was last pushed to that branch. This is the
        # step that opens a pull request against `main` with a token; it does not float.
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1   # v2
        with:
          version-script: node scripts/release-version.mjs
          pr-title: 'Release: the next version, and everything in it'
          commit-message: 'Cut a version'
          push-with-git-cli: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── THE VERSION PULL REQUEST MERGES ITSELF (owner ruling, 2026-09-05) ────────────────────────────
      #
      # Full automation during the pre-release phase: a merge carrying release notes cuts a version and
      # publishes it, with no click anywhere. The version still lands on `main` THROUGH A PULL REQUEST,
      # which is not ceremony — `main` is protected with required checks, so a workflow pushing the
      # version commit straight to it is a push the protection rejects. Auto-merge is how the bump gets
      # onto the branch without a credential that can write past the rules; a token that could do that
      # could do it for anything.
      #
      # WITHOUT THIS THE PIPELINE DEADLOCKS RATHER THAN STOPPING: the bump never lands, the notes stay
      # pending, and the next merge tries to publish a version that is already on the registry.
      #
      # It runs on EVERY push that leaves a standing version pull request, not only the first, and there
      # is no `continue-on-error` because enabling auto-merge on a pull request that already has it is
      # idempotent — measured twice against the live pull request on 2026-09-05, exit 0 both times. If
      # that ever stops being true, this step fails the version job and the release stops, which is the
      # direction to fail in.
      #
      # THE MESSAGE IS WRITTEN HERE, NOT LEFT TO GITHUB. An auto-merge with no subject takes GitHub's
      # default, which appends `(#23)` to the headline — the bare `#NNN` this project bans from commit
      # messages, written by our own automation into public history. Measured 2026-09-05 on the first
      # version pull request that merged itself.
      #
      # The version comes from the WORKING TREE here, and that is correct where reading it for the cut
      # decision is not: `changeset version` has just written it, and this commit is the one carrying it.
      # NOTHING TO CUT IS A REFUSAL WITH A REASON, NOT A QUIET SUCCESS (tracker issue 264's third
      # acceptance criterion). `changeset version` opens no pull request when no release notes have
      # accumulated, so an empty `pr-number` on a `beta` dispatch means the last cut already carries
      # everything on main. Saying so is the whole point: a dispatch that published nothing and exited 0
      # would read as a cut that happened.
      - name: A cut needs something to cut
        if: github.event_name == 'workflow_dispatch' && inputs.cut != 'rehearse' && steps.changesets.outputs.pr-number == ''
        run: |
          echo "::error::Nothing to cut: no release notes have accumulated since the last beta, so there is no version pull request to merge. Land a change carrying a note in .changeset/, then dispatch again."
          exit 1

      # ── THE ARTEFACT DECIDES, NOT THE INTENT (tracker issue 279) ────────────────────────────────────
      #
      # Everything above arranges for the right version to be computed. This checks that it WAS, by asking
      # the version itself rather than by trusting the arrangement — because the arrangement is what will
      # drift. A mechanism can be changed, a mode file can be deleted by a tool, a future input can be
      # added; none of that can make this step pass while the number says otherwise.
      #
      # It is the difference between "we entered pre mode, so this must be a beta" and "this version has a
      # pre-release suffix". Only the second is a fact about what would be published.
      #
      # Placed after the nothing-to-cut refusal on purpose: with no version pull request there is no new
      # version, and this would otherwise judge the one already on main.
      - name: The version this cut computed is the channel that was asked for
        if: github.event_name == 'workflow_dispatch' && inputs.cut != 'rehearse'
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          PRE=$(node scripts/release-dist-tag.mjs "$VERSION" --prerelease)
          CHANNEL=$(node scripts/release-dist-tag.mjs "$VERSION")
          echo "asked for: ${{ inputs.cut }} — computed $VERSION (pre-release: $PRE, channel: $CHANNEL)"
          if [ "${{ inputs.cut }}" = "beta" ] && [ "$PRE" != "true" ]; then
            echo "::error::A beta was asked for and this cut computed $VERSION, which is a STABLE version bound for the \`$CHANNEL\` channel. Refusing rather than publishing a stable from a button marked beta. The tree was probably not in pre-release mode when the version was computed."
            exit 1
          fi
          if [ "${{ inputs.cut }}" = "stable" ] && [ "$PRE" = "true" ]; then
            echo "::error::A stable was asked for and this cut computed $VERSION, which is a PRE-RELEASE bound for the \`$CHANNEL\` channel. Refusing rather than publishing a beta as the stable. The tree was probably still in pre-release mode when the version was computed."
            exit 1
          fi

      # ONLY ON A DISPATCHED CUT (tracker issue 264). This step used to run on every push, which is what
      # made a beta come out of every merge. The pull request still opens and updates on every push — it
      # is the standing answer to "what would the next version be" — and it merges when a maintainer asks
      # for a cut, days apart, never on its own.
      - name: Let it merge itself once its checks pass
        if: github.event_name == 'workflow_dispatch' && inputs.cut != 'rehearse' && steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          NOTES=$(node scripts/release-notes-for.mjs "$VERSION" || true)
          gh pr merge "${{ steps.changesets.outputs.pr-number }}" --squash --auto \
            --subject "Release $VERSION" \
            --body "$NOTES"

      # THIS TESTS THE VERSION TREE. IT DOES NOT UNBLOCK THE MERGE, AND THE COMMENT THAT SAID IT DID
      # WAS WRONG. The pull request is authored by `github-actions[bot]`, and every fork-approval policy
      # this repository has tried counts it as a contributor needing approval — all external
      # contributors, then first-time contributors, then first-time contributors new to GitHub. It
      # parked under all three, five times in one day. Being merged is not what takes an author off that
      # list: version pull requests 13, 29 and 32 all merged and 32 parked anyway. The policy is already
      # at its narrowest value, so there is no setting left to narrow.
      #
      # A dispatch is not a fork event and needs no approval, and that much is true — the run executes
      # and turns both required checks green on the pull request's head commit. WHAT IS NOT TRUE is that
      # this satisfies the pull request. MEASURED ON PULL REQUEST 32, 2026-09-05, both checks green at
      # 16:37:29Z: `commits/{sha}/check-runs` carried them, the pull request's own rollup was EMPTY, and
      # `mergeStateStatus` stayed BLOCKED. Approving the parked run by hand is what filled the rollup
      # with those same two names. A dispatched run's checks are not credited to the pull request; only
      # the `pull_request` run's are, and that is the run sitting parked.
      #
      # SO THE PROCESS OF RECORD IS ONE LANE APPROVAL PER CUT, AND THE GUARD NAMES IT. The step after
      # this one prints the run id and the command; whoever is on shift runs it. That is a lane's act,
      # not the owner's — his ruling was that no click of his stands between a merge and the registry,
      # and none does. Routed 2026-09-05. Do not spend work removing it until there is a way to have the
      # bot's own pull-request run start without a credential.
      #
      # AND IT IS ONE PER VERSION BRANCH, NOT ONE PER RELEASE. Every push to main re-runs `changeset
      # version` and force-updates this branch, so the head moves and the new head parks again. Measured
      # 2026-09-05: pull request 32's head was approved at 16:42Z, main moved at 16:43:03Z, and the
      # re-cut head arrived parked with the earlier approval no longer applying to anything. A busy
      # afternoon can therefore starve a release without anything going red — the cut needs a gap
      # between merges long enough for the approved run to finish.
      #
      # This dispatch stays because it tests the version tree without waiting for any of that, which is
      # worth a run on its own — but it is not the answer to the park, and rebuilding it as one is the
      # mistake this comment exists to stop.
      - name: Run CI on the version branch, which needs no approval to start
        if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref changeset-release/${{ github.ref_name }}
      # A VERSION WITH NO TAG HAS NOT BEEN RELEASED — asked of the COMMIT, never of the working tree.
      #
      # The step before this one runs `changeset version` IN PLACE: it rewrites every manifest and the
      # changelog on disk and hands the result to a pull request for somebody to merge. None of that is on
      # this branch yet, and the files say otherwise. Reading `package.json` from disk here therefore
      # reported that a push had cut `0.1.1-beta.0` when main still carried 0.1.0 and nobody had merged
      # anything — and the publish job started. It failed for an unrelated reason, which is the only thing
      # that stopped it.
      # ── ASKED OF THE PUSH, NOT OF WHATEVER HEAD HAS BECOME (tracker issue 208) ─────────────────────
      #
      # The changesets step above has already run `changeset version` AND COMMITTED the bump by the time
      # this runs, so HEAD carries the version branch's number while main carries the pushed one. Without
      # this the step answered about a version that exists on main nowhere: measured on run 34050690448,
      # `v0.1.11 has no tag — this push cut it` in the same run where the independent detector, checking
      # out main, said `v0.1.10 is already released`. One tree, two answers.
      #
      # It made `cut` true on essentially every push, which is why a wait conditioned on `cut != 'true'`
      # never armed, and why `publish` ran with nothing stranded and failed on `cannot publish over the
      # previously published versions: 0.1.10`.
      - name: Did this push cut a version
        id: cut
        env:
          CLEAROTRON_CUT_REF: ${{ github.sha }}
        run: node scripts/release-cut-decision.mjs

      # ── AND THE GATE COMES AFTER IT (tracker issue 208 / tracker issue 229) ─────────────────────────
      #
      # ORDER IS THE POINT. The decision above is what notices a version sitting cut and unpublished, and
      # it used to run AFTER the step below. On 2026-09-06 that step failed on a parked run and both
      # downstream jobs were skipped, so the 0.1.8 already stranded on main was never even asked about.
      # A detector placed downstream of the thing that strands a cut cannot run in the state it exists to
      # detect. It is first now, and it writes its output before anything here can fail.

      # AND THE CHECKS IT WAITS FOR HAVE TO EXIST. Auto-merge waits for required checks; a check that
      # never starts is not a check that failed, and the pull request simply sits there. That happened
      # here on 2026-09-05 — the fork-approval policy counted `github-actions[bot]` as an external
      # contributor, the run was created in `action_required`, and the pull request carried zero check
      # runs. Nothing was red. This refuses instead, and says which of the two shapes it found.
      #
      # A RED HERE IS THE PIPELINE WORKING, NOT FAILING. The refusal names the parked run and the one
      # command that clears it. `publish` skips on `needs` while this is red, which is correct: a version
      # that has not merged has not been cut, and there is nothing to publish yet. Once somebody approves
      # the run, the pull request merges itself and the push that lands it opens no new version pull
      # request — so this step is skipped on that run, the job is green, and the publish goes ahead.
      - name: The checks it waits for actually started
        if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-version-pr-checks.mjs "${{ steps.changesets.outputs.pr-number }}"


  # ── THE DETECTOR THAT CANNOT BE SKIPPED BY THE THING IT DETECTS (tracker issue 229) ────────────────
  #
  # Three strandings, none self-reported, all the same shape: the job that notices a cut sitting on main
  # unpublished was downstream of the gate that stranded it, so every time it mattered it was `skipped`.
  #
  # NO `needs:`. That is the whole design. This job cannot be skipped by another job's failure because it
  # does not depend on one, and it runs on every push to main whatever the rest of this file does.
  #
  # IT REPORTS AND DOES NOT PUBLISH. Read-only permissions, no environment, no registry credential: the
  # publish gate is the most safety-critical part of this file and widening it is not what this fixes.
  # A reader gets an annotation naming the stranded version; the cron and the version job still carry
  # the publishing.
  #
  # ONE CASE STAYS OPEN AND IS NAMED RATHER THAN PAPERED OVER: a version pull request that merges itself
  # starts NO run at all, so no job here fires and nothing annotates. Only the cron reaches that one.
  # Covering it needs a scheduled workflow of its own, which is a separate change.
  stranded:
    name: Is a version already cut and unpublished
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'CordilleraSarl/clearotron'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # ── THE INSTRUMENT IS THIS REF; THE SUBJECT IS `main` (tracker issue 245) ──────────────────
      #
      # This checked out `ref: main` and then ran scripts from it. The workflow YAML comes from the ref
      # the run started on, so on a `workflow_dispatch` from a branch the file was the branch's and the
      # SCRIPTS were main's — and `workflow_dispatch` is this pipeline's rehearsal, the one mechanism
      # whose whole purpose is to exercise a change before it lands. A change to the release scripts was
      # therefore never executed by the run meant to exercise it, and the rehearsal's verdict was about
      # code that is not the code under review.
      #
      # `github.sha` is the ref the run started on: the branch head on a dispatch, the pushed commit on a
      # push. That is the code under review, and it is what should run.
      #
      # THE QUESTION IS STILL ABOUT `main`, and that has not changed — it is now asked explicitly rather
      # than implied by whatever happened to be checked out. `origin/main` is fetched below and named as
      # the subject, so the tree this job QUESTIONS and the code it RUNS are two separate statements
      # instead of one accident.
      #
      # It also closes the narrower half: `ref: main` re-resolved at checkout time, so a commit landing
      # between the run starting and this step decided from a tree that did not trigger it.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0      # tags included: the cut decision reads them, and refuses without them

      # `origin/main` does not exist in a checkout pinned to a sha, and the scripts refuse by name rather
      # than guessing when it is absent — so it is fetched deliberately here. Refusing loudly is the
      # behaviour that makes this safe to change.
      - name: Make `origin/main` resolvable — it is the subject, not the instrument
        run: git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      # EVERY JOB IN THIS FILE RUNS THIS, and an arm counts them. The guard refuses if a credential, a
      # registry to authenticate against, or a publish without provenance ever appears here — a job
      # exempt from it is a job somebody can add one to later without the count noticing.
      - name: This pipeline publishes only the way it was authorised to
        run: node scripts/release-publish-guard.mjs

      - name: Ask main whether a cut is sitting there unpublished
        id: ask
        # NAMED, not implied. `cutRef()` defaults to HEAD, and HEAD is now this run's own ref rather than
        # main — so the subject is stated through the seam that already exists for it. Without this the
        # pin above would have quietly changed WHAT this job decides about, which is the opposite of the
        # separation it is making.
        env:
          CLEAROTRON_CUT_REF: origin/main
        run: node scripts/release-cut-decision.mjs

      # ── AND SAY IT WHERE SOMEBODY WILL SEE IT ────────────────────────────────────────────────────
      #
      # `release-cut-decision.mjs` PRINTS its answer and exits 0 — correct for its other three callers,
      # which read the output and decide. Here it would mean a green, silent job in exactly the state
      # this one exists to surface: the log would carry "v0.1.8 has no tag" and nothing would carry it
      # anywhere a reader looks. A detector that reports to nobody is the defect it was built to fix,
      # relocated one step.
      #
      # A WARNING ANNOTATION AND A JOB SUMMARY, so it appears on the run and in the pull request's checks
      # rather than only in a log somebody would have to open on purpose.
      - name: Say so, if one is
        if: steps.ask.outputs.cut == 'true'
        run: |
          echo "::warning title=A version is cut and unpublished::v${{ steps.ask.outputs.version }} is on main with no tag. It was cut and never published — the publish either did not run or did not reach the registry."
          {
            echo "### A version is sitting on main unpublished"
            echo ""
            echo "\`v${{ steps.ask.outputs.version }}\` carries no tag."
            echo ""
            echo "This job has no \`needs:\`, so it runs whatever else in this workflow failed or was skipped."
          } >> "$GITHUB_STEP_SUMMARY"

  # THE JOB THAT NOTICES. It asks main one question — does the version on this commit have a tag — and
  # it is the same function the push path calls, from the same commit, so there are not two answers to
  # one question. Nothing here is new logic; the trigger is the only new thing.
  #
  # IT IS IDEMPOTENT AND IT IS QUIET. A run finding nothing to cut exits 0 having said so; a run finding
  # the tag already present says that and exits 0. Only an unpublished cut turns `cut` true, and the
  # `publish` job below is what acts on it — this job has read-only permissions and cannot publish
  # anything itself.
  #
  # NO `npm ci`. Both scripts it runs import nothing but Node builtins and one file from `shared/`, and
  # this job wakes up every five minutes: an install here would be the whole cost of the mechanism.
  pending:
    name: Is a cut sitting on main unpublished
    # THE CRON ONLY. A scheduled run's ref IS the default branch, so it cannot be pointed at a feature
    # branch; `workflow_dispatch` stays a rehearsal. The wait that used to live here as a second entry
    # moved into the `version` job, where a person's run is what holds it — see the note there.
    if: github.event_name == 'schedule' && github.repository == 'CordilleraSarl/clearotron'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      cut: ${{ steps.cut.outputs.cut }}
      version: ${{ steps.cut.outputs.version }}
    steps:
      # ── THE INSTRUMENT IS THIS REF; THE SUBJECT IS `main` (tracker issue 245) ──────────────────
      #
      # This checked out `ref: main` and then ran scripts from it. The workflow YAML comes from the ref
      # the run started on, so on a `workflow_dispatch` from a branch the file was the branch's and the
      # SCRIPTS were main's — and `workflow_dispatch` is this pipeline's rehearsal, the one mechanism
      # whose whole purpose is to exercise a change before it lands. A change to the release scripts was
      # therefore never executed by the run meant to exercise it, and the rehearsal's verdict was about
      # code that is not the code under review.
      #
      # `github.sha` is the ref the run started on: the branch head on a dispatch, the pushed commit on a
      # push. That is the code under review, and it is what should run.
      #
      # THE QUESTION IS STILL ABOUT `main`, and that has not changed — it is now asked explicitly rather
      # than implied by whatever happened to be checked out. `origin/main` is fetched below and named as
      # the subject, so the tree this job QUESTIONS and the code it RUNS are two separate statements
      # instead of one accident.
      #
      # It also closes the narrower half: `ref: main` re-resolved at checkout time, so a commit landing
      # between the run starting and this step decided from a tree that did not trigger it.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0      # tags included: the cut decision reads them, and refuses without them

      # `origin/main` does not exist in a checkout pinned to a sha, and the scripts refuse by name rather
      # than guessing when it is absent — so it is fetched deliberately here. Refusing loudly is the
      # behaviour that makes this safe to change.
      - name: Make `origin/main` resolvable — it is the subject, not the instrument
        run: git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: This pipeline publishes only the way it was authorised to
        run: node scripts/release-publish-guard.mjs

      # THE SCHEDULE ASKS ONCE. If a cut is sitting there it has been sitting there, so there is nothing
      # to wait for — the waiting belongs to the run that set the merge in motion, and lives there.
      - name: Did a merge leave a version on main with no tag
        id: cut
        # Same reason as `stranded`: the pin makes HEAD this run's ref, so main is named as the subject
        # explicitly. A cron asks about main as it is now, and it still does.
        env:
          CLEAROTRON_CUT_REF: origin/main
        run: node scripts/release-cut-decision.mjs

  # ── THE WAIT, AS ITS OWN JOB SO IT CAN ACTUALLY ARM (tracker issue 208) ────────────────────────────
  #
  # It lived inside `version`, conditioned on `cut != 'true'`, and could not arm in the rhythm this
  # repository actually has: a version pull request self-merges firing nothing, the next push publishes
  # that stranded version AND cuts a new one — so `cut` is true, the wait is skipped, and the new cut is
  # stranded in its turn. Measured three times on 2026-09-06. The limitation was written up as an edge
  # case; it was the steady state.
  #
  # AFTER `publish`, NOT BESIDE IT. `release-await-cut.mjs` asks whether main carries a version with no
  # tag. Run in parallel with the first publish, it would see the STRANDED version still untagged and
  # answer about that one — and the job below would publish it a second time. Ordering it behind the
  # publish means the only untagged version it can find is the new one.
  #
  # A SKIPPED `publish` IS NOT A BLOCK. On a push with nothing stranded, `publish` does not run and this
  # job is the whole mechanism.
  # ONE WORD, NO HYPHEN, DELIBERATELY. `needs.await-the-cut.outputs.cut` does not read a job's output —
  # the expression parser takes the hyphens as subtraction and the condition silently evaluates to
  # something that is never `'true'`, so the job below would never run and nothing would say why.
  awaited:
    name: Wait for the version this cut asked for to merge itself
    needs: [version, publish]
    # A DISPATCHED CUT ONLY, AND THE PUSH ARM IS WHY THIS COMMENT EXISTS (tracker issue 271).
    #
    # This job used to arm on a push whenever a version pull request stood, because a push was what armed
    # auto-merge and the pull request then merged itself minutes later. The cadence change removed that:
    # auto-merge is armed by a dispatched `cut: beta` and by nothing else. The wait was left pointing at
    # the event that no longer occurs, so every merge to main held a runner for the full budget — twenty
    # five minutes — waiting for a self-merge that could not come.
    #
    # IT DID NOT GO RED, WHICH IS WHY IT NEEDED FINDING BY EYE. Expiry here is a deliberate quiet exit 0
    # (see the step below), and only a failure to LOOK exits 2. The run stayed green; what showed was a
    # long in-progress release job hanging off every merge, which reads as a stuck release.
    #
    # THE REHEARSAL STILL REACHES THIS JOB, and that is deliberate. A step nobody rehearses is a step
    # whose first real run is the day it matters. A rehearsal carries no version pull request to wait for,
    # so it runs the loop once with a zero budget — proving the wiring, the checkout, the credential guard
    # and the decision, and holding a runner for none of it.
    if: >-
      !failure() && !cancelled()
      && github.repository == 'CordilleraSarl/clearotron'
      && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # THE BUDGET CONTAINS THE WAIT, with room for the checkout and the fetches around it. A timeout under
    # the wait cancels this at the moment it was about to answer, and a cancelled job reads as neither a
    # pass nor a failure to anybody scanning the run. An arm couples the two numbers.
    # CONTAINS THE WAIT, WITH ROOM FOR THE CHECKOUT AND INSTALL ABOVE IT. The wait is 25 minutes
    # (tracker issue 247) and `MIN_JOB_MARGIN_MS` in release-await-cut.mjs is what an arm holds this to.
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      cut: ${{ steps.awaited.outputs.cut }}
      version: ${{ steps.awaited.outputs.version }}
      # THE COMMIT THE WAIT DECIDED ABOUT, so the publish below packs that tree and not whatever `main`
      # has become since — see tracker issue 238 and the guard in that job.
      sha: ${{ steps.awaited.outputs.sha }}
    steps:
      # ── THE INSTRUMENT IS THIS REF; THE SUBJECT IS `main` (tracker issue 245) ──────────────────
      #
      # This checked out `ref: main` and then ran scripts from it. The workflow YAML comes from the ref
      # the run started on, so on a `workflow_dispatch` from a branch the file was the branch's and the
      # SCRIPTS were main's — and `workflow_dispatch` is this pipeline's rehearsal, the one mechanism
      # whose whole purpose is to exercise a change before it lands. A change to the release scripts was
      # therefore never executed by the run meant to exercise it, and the rehearsal's verdict was about
      # code that is not the code under review.
      #
      # `github.sha` is the ref the run started on: the branch head on a dispatch, the pushed commit on a
      # push. That is the code under review, and it is what should run.
      #
      # THE QUESTION IS STILL ABOUT `main`, and that has not changed — it is now asked explicitly rather
      # than implied by whatever happened to be checked out. `origin/main` is fetched below and named as
      # the subject, so the tree this job QUESTIONS and the code it RUNS are two separate statements
      # instead of one accident.
      #
      # It also closes the narrower half: `ref: main` re-resolved at checkout time, so a commit landing
      # between the run starting and this step decided from a tree that did not trigger it.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0      # tags included: the cut decision reads them, and refuses without them

      # `origin/main` does not exist in a checkout pinned to a sha, and the scripts refuse by name rather
      # than guessing when it is absent — so it is fetched deliberately here. Refusing loudly is the
      # behaviour that makes this safe to change.
      - name: Make `origin/main` resolvable — it is the subject, not the instrument
        run: git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: This pipeline publishes only the way it was authorised to
        run: node scripts/release-publish-guard.mjs

      # GIVING UP IS THE ORDINARY OUTCOME, NOT A FAULT — checks that fail, a pull request somebody
      # dismisses, a re-cut mid-flight. The cron floor stays underneath, so a quiet give-up loses
      # nothing; reporting it as a failure would train every reader to ignore this job.
      - name: Watch main for the merge this push set in motion
        id: awaited
        env:
          # A rehearsal has nothing coming, so it reads once and reports. Set ONLY here — a real run
          # takes the file's own fifteen minutes.
          CLEAROTRON_RELEASE_WAIT_MS: ${{ github.event_name == 'workflow_dispatch' && inputs.cut == 'rehearse' && '0' || '' }}
        run: node scripts/release-await-cut.mjs

  publish:
    name: Publish the release to npm
    # BOTH DECIDERS ARE NEEDED AND EITHER MAY BE SKIPPED. `version` runs on a push to main and `pending`
    # on the cron, so on any given run one of them did not happen — which is why the condition opens with
    # `!failure() && !cancelled()` rather than relying on the default, and why a skipped decider reads as
    # "not this path" instead of blocking the job.
    needs: [version, pending]
    if: >-
      !failure() && !cancelled()
      && github.repository == 'CordilleraSarl/clearotron'
      && ((github.event_name == 'workflow_dispatch' && inputs.cut == 'rehearse')
          || needs.version.outputs.cut == 'true'
          || needs.pending.outputs.cut == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # THIS NAME IS THE REGISTRY'S, AND IT IS ALL IT IS NOW. npm's trusted publisher for this package is
    # registered against the repository, this workflow's FILENAME and this ENVIRONMENT NAME; renaming any
    # of the three makes the registry refuse the publish. Nothing else hangs on it.
    #
    # IT USED TO CARRY THE APPROVAL GATE, AND NO LONGER DOES. A required reviewer plus a protected-
    # branches policy lived here, added after this job once started on a version nobody had cut, and the
    # owner's 2026-09-05 ruling removed both: during the pre-release phase a merge publishes with no
    # click anywhere. Measured the same day — the repository has zero environments, so this line
    # re-creates `npm` unprotected on the next run. Its protected-branches half was what stopped a
    # publish from a pull-request branch; the explicit ref check in the step below is what carries that
    # now, and it is the reason that check is spelled out rather than left implied.
    #
    # The environment holds no secrets and must not be given any: the credential is minted per publish
    # from the run's OIDC token and never stored.
    environment: npm
    permissions:
      contents: write     # the tag and the GitHub release
      id-token: write     # the OIDC token npm exchanges for a short-lived publish credential
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Use an npm that can publish through OIDC
        run: |
          set -euo pipefail
          npm install -g "npm@${NPM_VERSION}"
          npm --version

      - run: npm ci

      - name: This pipeline publishes only the way it was authorised to
        run: node scripts/release-publish-guard.mjs

      # THE REFUSALS, ALL IN ONE PLACE AND BEFORE ANYTHING IS BUILT.
      #  · a real publish happens on a push, on the cron, or on a `workflow_dispatch` whose `cut` input
      #    is `beta` — the on-demand cut tracker issue 264 ruled in. Every other dispatch is still a
      #    rehearsal and still runs `npm publish --dry-run`. THE BRANCH CHECK BELOW IS WHAT HOLDS A
      #    DISPATCHED CUT TO `main`: a rehearsal may run from any branch precisely because it cannot
      #    publish, and a cut may not.
      #  · a tag and the manifest must name the same version. A tag is the one thing a person makes by
      #    hand, and one that disagrees with the manifest ships an artefact nobody can trace back. It
      #    refuses rather than reconciling: two spellings disagreeing means somebody's intention is
      #    unrecorded, and guessing which they meant is how the wrong one wins.
      #  · the channel is derived, never defaulted. `npm publish` with no `--tag` publishes to `latest`,
      #    and a version reaching `latest` by default rather than by decision is the failure. DURING THE
      #    PRE-RELEASE PHASE `latest` IS the pre-release, by the owner's ruling — "latest has all our
      #    fixes" — and `beta` is deliberately not also set: npm exchanges its OIDC token inside
      #    `npm publish` and nowhere else, so a second tag would need a long-lived credential in this
      #    repository, which is the one thing this design forbids. One publish, one tag.
      - name: What is being published, and whether this run may publish it
        id: what
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.cut }}" = "rehearse" ]; then
            # A rehearsal, and it stays one on whatever branch it was dispatched from — that is the
            # point of being able to dispatch it. The branch check below is skipped here BECAUSE the
            # dry-run flag is already set: a rehearsal that refused to rehearse anywhere but main would
            # be a rehearsal of nothing.
            echo "This is a rehearsal: the publish step will run with --dry-run."
            echo "dry_flag=--dry-run" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "schedule" ] \
            || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # `schedule` is a real publish, not a rehearsal: it is the path a self-merged version takes,
            # and it reaches here only when `pending` found a version on main with no tag. A scheduled
            # run's ref IS the default branch, so the branch check below holds it to the same rule.
            echo "dry_flag=" >> "$GITHUB_OUTPUT"
            # ── THE BRANCH, EXPLICITLY, BECAUSE THESE GUARDS ARE NOW THE WHOLE GATE ────────────────────
            #
            # There is no human between a merge and a publish any more: the environment's approval gate
            # is gone by the owner's ruling, and its protected-branches half went with it. What stands
            # between this repository and the registry is this step — the event, the repository, the
            # branch, a version read from the commit, and the check that it has not already been
            # released. A tag push is the other way in and is named as itself.
            case "${{ github.ref }}" in
              refs/heads/main) ;;
              *)
                echo "::error::A release publishes from main. This run is on ${{ github.ref }}."
                exit 1
                ;;
            esac
          else
            echo "::error::A release publishes on a push, on the cron that notices a self-merged cut, or on a dispatched \`beta\` cut. This run is a ${{ github.event_name }}."
            exit 1
          fi
          # The tag-versus-manifest check that stood here went with the tag trigger above: no run can
          # arrive on a tag ref any more, so a check for one would be a check that cannot fire — worse
          # than absent, because it reads as protection.
          DIST_TAG=$(node scripts/release-dist-tag.mjs "$VERSION")
          # THE CHANNEL AND THE FLAG ARE TWO QUESTIONS, and in pre mode they come apart. `0.1.1-beta.0`
          # goes to the `latest` CHANNEL by the owner's ruling, and it is still a pre-release. This was
          # `[ "$DIST_TAG" != "latest" ]` further down, which marks a beta as the stable release on the
          # page a reader opens to find out — so the flag is asked of the VERSION, by the function that
          # exists for it.
          PRERELEASE=$(node scripts/release-dist-tag.mjs "$VERSION" --prerelease)
          {
            echo "version=$VERSION"
            echo "dist_tag=$DIST_TAG"
            echo "prerelease=$PRERELEASE"
            echo "tarball=release-artefacts/clearotron-$VERSION.tgz"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing clearotron@$VERSION to the \`$DIST_TAG\` channel (prerelease: $PRERELEASE)."

      # The bundle is built, not committed, so a pack that runs before this ships a portal with nothing
      # to serve. The completeness check below is what proves it landed.
      - run: npm run build:ui

      # PACK ONCE, SEAL, SCAN THOSE BYTES, PUBLISH THOSE BYTES. `--pack-destination` does not create the
      # directory, and npm's failure for a missing one reads like a packing failure rather than a missing
      # folder. The seal below is inside the "once": it rewrites the manifest in place, before anything
      # scans or measures the artefact, so every step after it reads the bytes that go to the registry.
      - name: Pack the exact bytes that will be published
        run: |
          set -euo pipefail
          mkdir -p release-artefacts
          npm pack --pack-destination ./release-artefacts
          test -f "${{ steps.what.outputs.tarball }}"

      # THE PUBLISHED MANIFEST IS NOT THIS REPOSITORY'S MANIFEST, AND FIVE RELEASES SHIPPED AS THOUGH IT
      # WERE (tracker issue 180). `overrides: { "buffers": "$buffers" }` pins the clean-room replacement
      # for the unlicensed `buffers@0.1.1` while resolving THIS tree; npm's `$name` syntax resolves only
      # in a root project's own manifest, so a consumer installing this package as a dependency has
      # nothing to resolve it against and npm aborts the whole install. `npm install clearotron` failed
      # on 0.1.1-beta.0 through 0.1.3, five for five, before a single file was written.
      #
      # `scripts/pack-publishable.mjs` has stripped this since 2026-08-23 and cannot be called from here:
      # it needs `cut/packed-artifact.mjs`, which is withheld from the public repository, and exits 2
      # without it. Its refusal says an exported tree is not one a publishable tarball is packed from —
      # true until the public repository became the working home, false since. So the seal below applies
      # that script's own exported policy function to the packed artefact instead of restating it.
      - name: The published manifest is not this repository's manifest
        run: node scripts/release-artifact-seal.mjs --tarball "${{ steps.what.outputs.tarball }}"

      - name: No secret leaves in the packed bytes
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          mkdir -p packed
          tar -xzf "${{ steps.what.outputs.tarball }}" -C packed
          COUNT=$(find packed -type f | wc -l)
          echo "scanning $COUNT file(s) from the packed artefact"
          # A SCAN OVER NOTHING EXITS 0. That is the shape where the extract failed and the scan reported
          # clean, so the count is the check and the scan is what it enables.
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::nothing was extracted from the tarball, so nothing was scanned."
            exit 1
          fi
          ./gitleaks dir packed --config .gitleaks.toml --redact --no-banner
          rm -rf packed gitleaks gitleaks.tgz

      - name: What a stranger installs is complete
        run: node scripts/release-completeness-check.mjs --tarball "${{ steps.what.outputs.tarball }}"

      # AND THE ONLY QUESTION A VISITOR ASKS, TYPED AT THE BYTES ABOUT TO BE PUBLISHED. Every check
      # above passed on all five broken releases, because each asked something about the tarball and
      # none of them installed it. This one installs the artefact AS A DEPENDENCY of a throwaway
      # project, which is the only shape the `$buffers` failure exists in — a root install and a
      # `--dry-run` both exit 0 on the exact bytes that refuse for every real user. It is keyed to no
      # known cause, so it also catches the next packaging fault of a different shape.
      - name: "`npm install clearotron` works, on these exact bytes"
        run: node scripts/release-install-check.mjs --tarball "${{ steps.what.outputs.tarball }}"

      # PROPERTY 2, PROVED RATHER THAN ASSERTED (tracker issue 97: "prove the beta-to-stable promotion moves no
      # bytes; compare the artefacts, do not assert it from the configuration"). A promotion that rebuilt
      # would produce a different digest here, and two runs can be compared by anyone reading them.
      - name: Record the artefact digest, so a promotion can be shown to move no bytes
        run: |
          set -euo pipefail
          sha256sum "${{ steps.what.outputs.tarball }}" | tee release-artefacts/SHA256SUMS
          {
            echo "### clearotron@${{ steps.what.outputs.version }} → \`${{ steps.what.outputs.dist_tag }}\`"
