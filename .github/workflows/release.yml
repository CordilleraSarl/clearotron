              echo "The tag v$VERSION already exists."
            else
              gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$TARGET" >/dev/null
              echo "Tagged v$VERSION at $TARGET."
            fi
            # SEPARATE QUESTIONS, ASKED SEPARATELY. A beta cut before this change has a tag and no entry,
            # so a run that exited as soon as it saw the tag would never give it one. The tag and the
            # entry are checked independently for that reason.
            if gh release view "v$VERSION" >/dev/null 2>&1; then
              echo "The GitHub release v$VERSION already exists."
              exit 0
            fi
            NOTES=$(node scripts/release-notes-for.mjs "$VERSION" || true)
            if [ -n "$NOTES" ]; then
              printf '%s\n' "$NOTES" > release-notes.md
              gh release create "v$VERSION" --target "$TARGET" --title "v$VERSION" --notes-file release-notes.md --prerelease
            else
              gh release create "v$VERSION" --target "$TARGET" --title "v$VERSION" --generate-notes --prerelease
            fi
            echo "Released v$VERSION as a pre-release, marked Pre-release on the Releases page."
            exit 0
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "The GitHub release v$VERSION already exists."
            exit 0
          fi
          NOTES=$(node scripts/release-notes-for.mjs "$VERSION" || true)
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > release-notes.md
            gh release create "v$VERSION" --target "$TARGET" --title "v$VERSION" --notes-file release-notes.md
          else
            gh release create "v$VERSION" --target "$TARGET" --title "v$VERSION" --generate-notes
          fi

  publish-awaited:
    name: Publish the version this push cut, once it merges itself
    # BOTH DECIDERS ARE NEEDED AND EITHER MAY BE SKIPPED. `version` runs on a push to main and `pending`
    # on the cron, so on any given run one of them did not happen — which is why the condition opens with
    # `!failure() && !cancelled()` rather than relying on the default, and why a skipped decider reads as
    # "not this path" instead of blocking the job.
    needs: [version, publish, awaited]
    # THE SECOND PUBLISH OF THE RUN, and it publishes a DIFFERENT version from the first.
    #
    # `publish` above releases whatever was already sitting on main unpublished. This one releases the
    # version pull request THIS push cut, after `await-the-cut` has watched it merge itself. One run,
    # two versions, because a push routinely does both and publishing only the older one is what left a
    # version stranded after every merge.
    #
    # `!failure() && !cancelled()` for the same reason the first job carries it: `publish` is skipped on
    # a push with nothing stranded, and a skipped predecessor must read as "not that path" rather than
    # as a block.
    if: >-
      !failure() && !cancelled()
      && github.repository == 'CordilleraSarl/clearotron'
      && (needs.awaited.outputs.cut == 'true'
          || (github.event_name == 'workflow_dispatch' && inputs.cut == 'rehearse'))
