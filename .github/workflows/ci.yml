# CI for this repository: the offline suites, the lint and licence checks, and the portal bundle.
#
# ── EVERY STEP HERE WAS RUN BEFORE IT WAS WRITTEN ────────────────────────────────────────────────
#
# This file is not a template and it is not adapted from somewhere else by reading. Each step below was
# executed against a full checkout of this tree and is here because it came back green:
#
#   npm ci                              ok
#   npm run test:full                   8,091 tests, 0 failures  (portal-ui's own `test` typechecks first)
#   npm run test:providers              450 tests, 0 failures
#   npm run lint:driver                 ok
#   node scripts/spdx-headers.mjs       ok — 1,508 files carry the licence line
#   npm run notices:check               ok
#   npm run tokens:check                ok
#   npm run build:ui                    ok
#
# A step nobody has watched pass is a step that will fail for the first contributor who touches it, and
# a green badge over an unrun check is worse than no badge.
#
# ── THE CITATION CHECK RUNS HERE, AND IT TOOK A RULING TO MAKE THAT POSSIBLE ─────────────────────
#
# `scripts/citation-line-check.mjs` verifies that a comment citing a source file and line still points at
# the line it means. It very nearly could not be a job here at all. It used to refuse below an ABSOLUTE
# floor — a minimum number of citations, calibrated against the repository it was written in — and this
# tree is smaller, so it refused a count that was legitimately correct. A check that only works on the
# tree it was calibrated against is not a check anyone else can run.
#
# The floor is now RELATIVE: the count is compared against this tree's own recorded count, and a sharp
# drop refuses unless the commit declares the loss. A broken extractor sends the count toward zero,
# which is a large proportional drop at any size — so the reason for having a floor survives, and the
# number that made it unportable is gone.
#
# THIS TREE RECORDS ITS OWN BASELINE IN ITS FIRST COMMIT. A baseline is about one corpus, so a count
# carried over from another repository would be wrong here on day one. `--record-count` writes it, and
# refuses to write one from a tree that already has unresolved citations — recording damage as the new
# normal is the failure that would make the whole check worthless.
#
# ── AND WHAT IS ABSENT ON PURPOSE ────────────────────────────────────────────────────────────────
#
# No macOS tier. The suites are platform-independent and a second platform doubles the runner cost of
# every pull request; add one when somebody reports a problem that only appears there.
#
# No runner label, no repository variable and no credential. `ubuntu-latest` is written literally so it
# resolves the same way for a fork as it does here, and nothing below reads `secrets` — a pull request
# from a fork cannot see them, so a job that needs one is a job that is red for every outside
# contributor and green only for maintainers.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # DISPATCHABLE SO THE VERSION PULL REQUEST CAN CHECK ITSELF. `github-actions[bot]` authors that pull
  # request, and every fork-approval policy this repository has tried counts it as a contributor needing
  # approval — its run is created `action_required` and produces no check runs at all, so auto-merge
  # waits on checks that never start. A dispatch is not a fork event and needs no approval; its check
  # runs land on the same head SHA under the same job names, which is what branch protection matches on.
  #
  # EVERY JOB RUNS ON A DISPATCH, and that was measured rather than assumed: nothing here is gated on
  # `github.event_name`. On the repository this one grew out of, a dispatch ran one tier alone and made a
  # run that verified nothing — a warning worth checking before building on it, and it does not carry.
  #
  # The count moved from two jobs to four with the public cut, and the invariant is what survived, not
  # the number. `guards` reads a diff and so needs a base; it takes the pull request's when there is one
  # and `origin/main` when there is not, rather than gating itself on the event and going missing from
  # exactly the dispatched run the paragraph above exists to make whole.
  workflow_dispatch:

# LEAST PRIVILEGE, and it matters more here than it does on a private repository: a public repository
# takes pull requests from forks, and a workflow with write scope is a workflow a stranger's branch can
# aim at. Nothing below writes anything.
permissions:
  contents: read

# Supersede a branch's own earlier run, never main's. Cancelling a main run would leave the branch
# people trust with no verdict at all, which is the one place the saved minutes are not worth it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  suites:
    name: The offline suites
    runs-on: ubuntu-latest
    steps:
      # A REAL CHECKOUT, WHICH IS LOAD-BEARING AND NOT BOILERPLATE. A large part of this suite reads the
      # files it checks with `git ls-files`, and outside a checkout those guards do not fail — they
      # SKIP, and the run goes green having checked nothing. Running this suite from an unpacked source
      # archive produces exactly that: a clean result from checks that never looked. A shallow clone is
      # fine; `git ls-files` needs an index, not history.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Pinned rather than '22', so a Node patch release cannot change what a green run means.
          # package.json requires >=22.
          node-version: '22.23.2'
          cache: npm

      # `npm ci` and not `npm install`: it installs the lockfile as written and refuses if the two
      # have drifted, which is the property a check wants.
      - run: npm ci

      # Both suites are OFFLINE by construction — no model is called, no register is queried, nothing is
      # spent. The provider suites drive their adapters over a stubbed fetch, and every fixture host is
      # under a reserved `.test` domain, so a run that somehow escaped its stub would fail to resolve
      # rather than reach a real service.
      - run: npm run test:full
      - run: npm run test:providers

  checks:
    name: Lint, licences, tokens and the built bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci

      - run: npm run lint:driver

      # The licence line is a term of the AGPL section 7 notice this project ships under, so a file
      # that loses it is a licensing defect rather than a style one.
      - run: node scripts/spdx-headers.mjs --check

      # THIRD-PARTY-NOTICES.md must match what is actually installed. A stale notices file on a public
      # repository is a claim about other people's licences that is not true.
      - run: npm run notices:check

      # The design tokens are generated; this fails when the generated file and its source disagree,
      # which is the only way anyone finds out before a rebuild silently changes the portal.
      - run: npm run tokens:check

      # The portal is the product. A tree whose bundle does not build ships a product nobody can open.
      - run: npm run build:ui

      # Line citations still point where they say. See the note at the top: this compares against the
      # count recorded in this repository, so it works here at whatever size this tree happens to be.
      - run: node scripts/citation-line-check.mjs

      # THE CENSUS IS THE GATE, NOT THE EXIT CODE. It pins per-file test AND assertion counts, and it
      # exists for the five ways a suite gets smaller while still reporting success: a file deleted, a
      # file renamed out of the collection glob, a file hollowed out, a file skipped, a file gated
      # behind an env var nobody sets. A suite that lost 75 tests still exits 0 — that is measured, not
      # hypothetical, and it is the reason this line is here rather than trusted to the suite.
      #
      # `--check` and not a bare run: the script took one flag for a long time and an unrecognised
      # argument fell through to the dry run, which prints a diff and exits 0 always. Lane gates read
      # `--check` and believed it, so a line reported as a census gate measured nothing.
      - run: node scripts/mint-suite-census.mjs --check

      # A RELEASE NOTE IS CHECKED WHERE IT IS WRITTEN. The release workflow checks them too, but that is
      # the wrong moment to find out: by then the note is on `main`, the author has moved on, and the
      # correction is a second pull request. Here it is one edit away from the person holding it.
      - run: node scripts/release-notes-lint.mjs

  build-and-verify:
    name: Build the portal bundle, verify it in a real browser, and scan for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci

      # THE BUNDLE IS BUILT BEFORE ANYTHING LOOKS AT IT. Every screen check below loads what this step
      # writes; in the other order they measure the previous build, or an empty directory, and report
      # that in the voice of a layout result.
      - run: npm run build:ui

      # ── TWO SCANS, AND THE SECOND ONE IS NOT A BELT-AND-BRACES REPEAT ───────────────────────────
      #
      # gitleaks honours .gitignore, and portal-ui/dist/ is ignored. Measured on this tree: a scan
      # rooted at the checkout reads the same 67,282,944 bytes whether or not the bundle has been
      # built, so it NEVER reaches it. One scan of the repository would look like it covered
      # everything and would silently cover none of the shipped JavaScript — which is the only
      # artefact here a reader actually loads. So the bundle is scanned by name, after it exists.
      #
      # node_modules is ignored too and enters neither scan, so where these steps sit relative to
      # `npm ci` changes nothing. That was worth measuring rather than assuming: the ordering looks
      # like it ought to matter.
      #
      # A SECURITY RECORD, NOT A PROGRESS BAR. Pinned by version AND by digest — a scanner fetched by
      # tag is a scanner somebody else can change, and this step's whole value is that its answer can
      # be trusted. 8.30.1 rather than 8.18.4 because the older build read files in 10,000-byte chunks
      # and truncated a match that straddled a boundary: a 40-character credential was missed ENTIRELY
      # and the scan reported clean. That pin cannot move back quietly — an arm in the driver suite
      # fails on 8.18.4 and passes on 8.30.1, and its name says which.
      - name: No secret is in the tree or in the built bundle
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks version

          # A SCAN OVER NOTHING EXITS 0. That is the shape in which a failed checkout or an unbuilt
          # bundle reports clean, so each count is the check and the scan is what it enables.
          TRACKED=$(git ls-files | wc -l)
          BUNDLE=$(find portal-ui/dist -type f | wc -l)
          echo "scanning $TRACKED tracked file(s) and $BUNDLE built bundle file(s)"
          if [ "$TRACKED" -eq 0 ]; then
            echo "::error::no tracked files, so the tree was not scanned."
            exit 1
          fi
          if [ "$BUNDLE" -eq 0 ]; then
            echo "::error::portal-ui/dist is empty, so the bundle was not scanned."
            exit 1
          fi
          ./gitleaks dir . --config .gitleaks.toml --redact --no-banner
          ./gitleaks dir portal-ui/dist --config .gitleaks.toml --redact --no-banner
          rm -f gitleaks gitleaks.tgz

      # ── THE ONLY CHECKS IN THIS REPOSITORY THAT CAN SEE A LAYOUT ────────────────────────────────
      #
      # `scripts/` is not an npm workspace, so `npm test` and `npm run test:full` never reach these
      # files — this job is the whole of their coverage. Every other test in this tree asserts on
      # strings, and a string assertion cannot see a card that overflowed, a header that stopped
      # sticking, a frame two pixels shorter than its contents, or a control meant to be clicked being
      # printed onto paper.
      #
      # They spawn `google-chrome`, which ubuntu-latest ships, headless and with no sandbox. Each leads
      # a process group and reaps it on every exit path it can observe, so a cancelled job does not
      # leave a browser running on the runner.
      #
      # driver/test/browser-check-membership.test.mjs asserts that every `scripts/*-check.mjs` is either
      # invoked here or declared there as one that cannot run in CI, with the reason it cannot. A check
      # dropped from this list without an exemption to replace it turns that arm red instead of going
      # quiet — which is the whole point, because a check that stops running looks exactly like a check
      # that passes.

      # Does a delivered report lay out inside the portal's iframe? `--fixture-pool` needs no
      # deployment: it renders this tree's own fixture rather than reaching for a box.
      - run: node scripts/render-check.mjs --fixture-pool

      # Does the browser accept the sandbox we think we wrote? It reads back the attributes Chrome
      # actually kept, rather than the ones the source sets.
      - run: node scripts/report-frame-check.mjs

      - run: node scripts/home-render-check.mjs
      - run: node scripts/clearances-render-check.mjs
      - run: node scripts/composer-render-check.mjs
      - run: node scripts/ai-page-render-check.mjs
      - run: node scripts/portal-lifecycle-check.mjs

      # Every relative markdown link in the tracked tree resolves to something on disk. No browser, but
      # the same family: a broken link in the docs is invisible to every other check in this file.
      - run: node scripts/markdown-link-check.mjs

      # WHAT A STRANGER INSTALLS IS COMPLETE. The release workflow asks this of the artefact it is about
      # to publish, which is the wrong moment to hear the answer: by then the file list has changed, the
      # author has moved on, and the correction is a second pull request. Asked here it reaches the
      # person still holding the change.
      - name: What a stranger installs is complete
        run: |
          set -euo pipefail
          TARBALL=$(npm pack --pack-destination ./packed | tail -1)
          node scripts/release-completeness-check.mjs --tarball "./packed/${TARBALL}"

  guards:
    name: The pattern guards
    runs-on: ubuntu-latest
    steps:
      # THE WHOLE HISTORY, and it is not caution. The default shallow fetch does not carry the base
      # commit, so `git diff base...HEAD` fails to resolve it — and the way that fails is the shape this
      # repository cares about: an unresolvable base is an error, but a guard wired to swallow it would
      # report a clean diff over a change it never read.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # AND `origin/main` HAS TO BE IN THE CLONE, which `fetch-depth: 0` does not by itself promise.
      # Depth is how MUCH history is fetched; the refspec decides WHICH refs come with it, and checkout
      # builds that refspec from the ref it was asked for. On a dispatch that ref is
      # `changeset-release/main` — the version branch, the one case this job was ungated to cover — so
      # main need not arrive at all, and `git diff origin/main...HEAD` would exit 2 on exactly the run
      # the ungating was for. Fetched by name instead of reasoned about: this is one network call, it
      # fails loudly if main is unreachable, and it makes the question moot on every event.
      - name: Fetch main, the base the guard falls back to
        run: git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main

      # No `npm ci`. This guard reads git and nothing else, so it answers in seconds and gives a
      # contributor the correction while they are still holding the change.
      - name: No bare reference is added in a comment or in prose
        # THE BASE, WRITTEN OUT RATHER THAN LEFT TO FALL THROUGH. A pull request carries the commit it
        # was opened against, and that is the only base that answers "what did this change add". Every
        # other event carries none, and the expression then renders the empty string.
        #
        # An empty `--base` does NOT fail: measured, the script reads it as absent and uses its own
        # `origin/main` default, printing `read N added line(s) against origin/main`. So the fallback
        # here changes no behaviour — it moves the choice to where a reader of this file can see it,
        # instead of leaving an empty argument to be silently rewritten one layer down. On a dispatch
        # `origin/main` is the version branch's real base; on a push to main it resolves to HEAD, and
        # the guard prints a zero-line read rather than a clean verdict on a change it never had.
        run: node scripts/added-reference-check.mjs --base "${{ github.event.pull_request.base.sha || 'origin/main' }}"
