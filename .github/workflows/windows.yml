#
# Windows: install what a stranger installs, ask it what it sees, open the demo and put it away again,
# then run a whole clearance on each engine against the stand-in programs the adapter tests use.
#
# THE README SAYS WINDOWS, NATIVELY, FROM POWERSHELL, and nothing in ci.yml or release.yml runs there:
# every other job is ubuntu-latest or macos-latest. This job is the evidence. The install, doctor and demo
# half is macos.yml's, in PowerShell. The clearance half is what macos.yml does not have and Windows
# needs: the way a turn is started, located and stopped differs there, so a change made on Linux can
# break it without any Linux test noticing.
#
# IT HOLDS NOTHING AND PUBLISHES NOTHING. A read-only token, no secrets, no environment. The demo serves
# the package's own frozen example over loopback, and the clearances run against stand-in programs that
# replay what the vendor programs send: no model, no register, no key.
#
# EVERY ACTION IS PINNED BY COMMIT, with its tag beside it, so a moved tag cannot change what runs here.
name: Windows

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - windows-native

permissions:
  contents: read

jobs:
  install:
    name: Install, doctor and demo on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PORT: '19470'
    defaults:
      run:
        shell: pwsh
    steps:
      # LINE ENDINGS AS THEY SHIP. Git on the Windows runner turns LF into CRLF on checkout, which no
      # installed copy ever sees: the package is packed on Linux. It breaks every check that reads source
      # text, and would pack a CRLF tarball here, so the checkout keeps LF.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020   # v7
        with:
          node-version: '22.23.2'
          cache: npm

      - run: npm ci

      - run: npm run build:ui

      - name: Pack and seal the bytes a stranger installs
        run: |
          New-Item -ItemType Directory -Force packed | Out-Null
          $tarball = (npm pack --pack-destination ./packed | Select-Object -Last 1)
          if ($LASTEXITCODE -ne 0) { throw "npm pack failed" }
          node scripts/release-artifact-seal.mjs --tarball "./packed/$tarball"
          if ($LASTEXITCODE -ne 0) { throw "the seal failed" }
          "TARBALL=$PWD\packed\$tarball" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Install it into an empty folder, as a dependency
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'stranger'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Set-Location $dir
          npm init -y | Out-Null
          npm install --no-audit --no-fund $env:TARBALL
          if ($LASTEXITCODE -ne 0) { throw "npm install failed" }
          if (-not (Test-Path '.\node_modules\.bin\clearotron.cmd')) { throw "npm made no clearotron.cmd" }

      - name: clearotron doctor
        working-directory: ${{ runner.temp }}/stranger
        run: |
          .\node_modules\.bin\clearotron.cmd doctor
          if ($LASTEXITCODE -ne 0) { throw "doctor exited $LASTEXITCODE" }

      # STOPPED THE WAY WINDOWS STOPS A PROGRAM FROM OUTSIDE: the launcher is ended with no chance to
      # clean up, as closing its window ends it. What it started must go with it, which is the promise
      # the README makes, so the port is asked again and the process list is read afterwards.
      - name: clearotron demo answers on its port, and stops
        working-directory: ${{ runner.temp }}/stranger
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'demo.log'
          $base = Join-Path $env:RUNNER_TEMP 'demo'
          $launcher = Start-Process -PassThru -NoNewWindow -FilePath node `
            -ArgumentList @('node_modules\clearotron\bin\clearotron.mjs', 'demo', '--no-open', '--port', $env:PORT, '--base', $base) `
            -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          $health = "http://127.0.0.1:$env:PORT/portal/health"
          $up = $false
          for ($i = 0; $i -lt 90; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 $health
              if ($r.StatusCode -eq 200 -and $r.Content -match '"ui":"built"') { $up = $true; break }
            } catch { }
            if ($launcher.HasExited) { break }
            Start-Sleep -Seconds 2
          }
          if (-not $up) {
            Get-Content $log, "$log.err" -Tail 40
            if (-not $launcher.HasExited) { Stop-Process -Id $launcher.Id -Force }
            throw "the portal never answered on port $env:PORT with its bundle built"
          }
          "the portal answered on port $env:PORT"
          $tree = Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'node.exe' -and $_.CommandLine -match 'clearotron' }
          "running before the stop: $($tree.Count) node programs of this install"
          Stop-Process -Id $launcher.Id -Force
          $left = $null
          for ($i = 0; $i -lt 30; $i++) {
            $left = Get-CimInstance Win32_Process | Where-Object { $_.ProcessId -in $tree.ProcessId }
            if (-not $left) { break }
            Start-Sleep -Seconds 1
          }
          if ($left) {
            $left | Format-Table ProcessId, ParentProcessId, CommandLine -AutoSize | Out-String -Width 400
            throw "30 seconds after the launcher ended, these programs it started were still running"
          }
          $after = $null
          try { $after = (Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 $health).StatusCode } catch { }
          if ($after) { throw "the demo ended and port $env:PORT still answers (http $after)" }
          "stopped: nothing the demo started is running, and port $env:PORT is quiet"

      # CTRL-C, AS A READER PRESSES IT. `start` runs in a console of its own, as it does in the window a
      # reader types into, with its portal, its two doors and its worker, the worker set on a stand-in
      # engine program. A second PowerShell joins that console and sends Ctrl-C to it, which Windows
      # delivers to every program in the console, exactly as the key does. What `start` had running is
      # read from the process list first, by parent number from its own pid, and must all be gone after.
      - name: Ctrl-C stops a foreground start, and everything it started
        working-directory: ${{ runner.temp }}/stranger
        run: |
          $home2 = Join-Path $env:RUNNER_TEMP 'start-home'
          New-Item -ItemType Directory -Force $home2 | Out-Null
          $log = Join-Path $env:RUNNER_TEMP 'start.log'
          $env:USERPROFILE = $home2; $env:HOME = $home2
          $env:CLEAROTRON_NO_ENV_FILE = '1'; $env:PORTAL_LOCAL_USER = 'op@localhost'
          $env:PORTAL_SERVICE_PORT = '19480'; $env:TRADEMARK_MCP_HTTP_PORT = '19481'; $env:CLIENT_MCP_HTTP_PORT = '19482'
          $env:CLEAROTRON_AI = 'anthropic-agent'
          $env:CLEAROTRON_CLAUDE_PATH = Join-Path $env:GITHUB_WORKSPACE 'driver\test\mock-claude.mjs'
          # No -NoNewWindow: the start gets a console of its own, which is what Ctrl-C is sent to.
          $start = Start-Process -PassThru -FilePath node `
            -ArgumentList @('node_modules\clearotron\bin\clearotron.mjs', 'start') `
            -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          $up = $false
          for ($i = 0; $i -lt 90; $i++) {
            if ((Test-Path $log) -and (Select-String -Quiet -Path $log -Pattern 'Sign in as')) { $up = $true; break }
            if ($start.HasExited) { break }
            Start-Sleep -Seconds 2
          }
          if (-not $up) {
            Get-Content $log, "$log.err" -Tail 60 -ErrorAction SilentlyContinue
            if (-not $start.HasExited) { Stop-Process -Id $start.Id -Force }
            throw "start never came up, so there was nothing to press Ctrl-C on"
          }
          Start-Sleep -Seconds 5
          # Everything under the start, by parent number, counting only a child that began after its parent.
          $all = Get-CimInstance Win32_Process
          $tree = @($all | Where-Object ProcessId -eq $start.Id)
          for ($i = 0; $i -lt $tree.Count; $i++) {
            $p = $tree[$i]
            $tree += @($all | Where-Object { $_.ParentProcessId -eq $p.ProcessId -and $_.CreationDate -ge $p.CreationDate -and $_.ProcessId -notin $tree.ProcessId })
          }
          $tree | Format-Table ProcessId, ParentProcessId, Name, CommandLine -AutoSize | Out-String -Width 300
          $nodes = @($tree | Where-Object Name -eq 'node.exe')
          if ($nodes.Count -lt 4) { throw "start had $($nodes.Count) node programs running; the launcher, start, the portal, the two doors and the worker were expected" }

          $ctrlc = @'
          Add-Type -Namespace W -Name Con -MemberDefinition @"
          [DllImport("kernel32.dll", SetLastError=true)] public static extern bool FreeConsole();
          [DllImport("kernel32.dll", SetLastError=true)] public static extern bool AttachConsole(uint pid);
          [DllImport("kernel32.dll", SetLastError=true)] public static extern bool SetConsoleCtrlHandler(System.IntPtr h, bool add);
          [DllImport("kernel32.dll", SetLastError=true)] public static extern bool GenerateConsoleCtrlEvent(uint ev, uint group);
          "@
          [W.Con]::FreeConsole() | Out-Null
          if (-not [W.Con]::AttachConsole([uint32]$args[0])) { Write-Output "could not join the console of $($args[0])"; exit 3 }
          [W.Con]::SetConsoleCtrlHandler([System.IntPtr]::Zero, $true) | Out-Null
          if (-not [W.Con]::GenerateConsoleCtrlEvent(0, 0)) { exit 4 }
          Start-Sleep -Seconds 2
          exit 0
          '@
          $script = Join-Path $env:RUNNER_TEMP 'ctrl-c.ps1'
          Set-Content -Path $script -Value $ctrlc -Encoding utf8
          $sender = Start-Process -PassThru -Wait -NoNewWindow -FilePath powershell.exe `
            -ArgumentList @('-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-File', $script, $start.Id)
          if ($sender.ExitCode -ne 0) { throw "Ctrl-C could not be sent to the start's console (exit $($sender.ExitCode))" }
          "Ctrl-C sent to the console of $($start.Id)"

          if (-not $start.WaitForExit(30000)) { throw "start was still running 30 seconds after Ctrl-C" }
          $left = $null
          for ($i = 0; $i -lt 15; $i++) {
            $now = Get-CimInstance Win32_Process
            $left = @($tree | Where-Object { $t = $_; $now | Where-Object { $_.ProcessId -eq $t.ProcessId -and $_.CreationDate -eq $t.CreationDate } })
            if (-not $left.Count) { break }
            Start-Sleep -Seconds 1
          }
          Get-Content $log -Tail 15
          if ($left.Count) {
            $left | Format-Table ProcessId, Name, CommandLine -AutoSize | Out-String -Width 300
            throw "15 seconds after start ended, these programs it started were still running"
          }
          "stopped: Ctrl-C ended start and all $($tree.Count) programs it had running"

  # A WHOLE CLEARANCE ON EACH ENGINE, against the stand-in programs the adapter tests use: every stage is
  # started as Windows starts it, from the program setup would find, and the stand-in replays what the
  # vendor program sends. Around it: the write boundary refusing a write into a protected tree, the
  # dispositions and grid paths, every Windows arm, and the stop of a real tree read back from the
  # process list. A run that skipped the Windows-only arms, or ran nothing, is not a pass.
  clearances:
    name: A clearance on each engine, against stand-in programs, on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      # LINE ENDINGS AS THEY SHIP. Git on the Windows runner turns LF into CRLF on checkout, which no
      # installed copy ever sees: the package is packed on Linux. It breaks every check that reads source
      # text, and would pack a CRLF tarball here, so the checkout keeps LF.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020   # v7
        with:
          node-version: '22.23.2'
          cache: npm

      - run: npm ci

      - name: The clearances, the write boundary, and the Windows stop
        working-directory: driver
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'clearances.log'
          $files = @('test/pipeline.anthropic.test.mjs', 'test/pipeline.openai.test.mjs',
            'test/deny-authority-write.test.mjs', 'test/disposition-form-tool.test.mjs', 'test/disposition-tool.test.mjs',
            'test/audit-grid-log.test.mjs') + @(Get-ChildItem test -Filter 'a-windows-*.test.mjs' | ForEach-Object { "test/$($_.Name)" })
          node ../scripts/test-run.mjs node --test --test-reporter=tap @files *> $log
          $status = $LASTEXITCODE
          Get-Content $log | Select-String -Pattern '^(not ok|# (tests|pass|fail|skipped|cancelled) )' | ForEach-Object { $_.Line }
          if ($status -ne 0) { Get-Content $log -Tail 200; throw "the suite exited $status" }
          $tests = [int]((Select-String -Path $log -Pattern '^# tests (\d+)$').Matches[0].Groups[1].Value)
          # 91 ran on Windows on 2026-09-23. Fewer means a file was not run, or lost tests; raise it when tests are added.
          if ($tests -lt 91) { throw "only $tests tests ran, where these files held 91, so some never ran" }
          foreach ($name in @('the immediate stop ends a turn and what it started', 'a turn that goes quiet is stopped by the watchdog',
                              'the process list holds this program')) {
            $line = Select-String -Path $log -SimpleMatch "- $name" | Select-Object -First 1
            if (-not $line -or $line.Line -notmatch '^\s*ok ' -or $line.Line -match '# SKIP') {
              throw "the Windows-only arm '$name' did not run and pass: $($line.Line)"
            }
          }
          "every clearance arm ran, and the Windows-only arms ran and passed"

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7
        with:
          name: windows-clearances
          path: ${{ runner.temp }}/clearances.log
          retention-days: 7

  # THE WHOLE DRIVER SUITE ON WINDOWS. Every test that assumes a POSIX machine is skipped there by name,
  # with the mechanism Windows lacks as its reason; every other arm runs and must pass. A repository guard
  # that could not read its corpus prints `[repo-guard] SKIPPED` and fails the shard, as in ci.yml.
  suite:
    name: Driver suite on Windows, shard ${{ matrix.shard }} of 4
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # LINE ENDINGS AS THEY SHIP. Git on the Windows runner turns LF into CRLF on checkout, which no
      # installed copy ever sees: the package is packed on Linux. It breaks every check that reads source
      # text, and would pack a CRLF tarball here, so the checkout keeps LF.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020   # v7
        with:
          node-version: '22.23.2'
          cache: npm

      - run: npm ci

      - name: This shard of the driver suite
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'suite.log'
          node scripts/test-full.mjs --only driver --shard ${{ matrix.shard }}/4 *> $log
          $status = $LASTEXITCODE
          Get-Content $log | Select-String -Pattern '^(# (tests|pass|fail|skipped|cancelled) |  (FAILED|ok) )' | ForEach-Object { $_.Line }
          $skipped = Select-String -Path $log -SimpleMatch '[repo-guard] SKIPPED'
          if ($skipped) { $skipped | ForEach-Object { $_.Line }; throw "a repository guard SKIPPED on a runner that has a checkout, so its green means nothing" }
          if ($status -ne 0) { Select-String -Path $log -Pattern '^not ok' | ForEach-Object { $_.Line }; throw "this shard exited $status" }

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7
        with:
          name: windows-suite-${{ matrix.shard }}
          path: ${{ runner.temp }}/suite.log
          retention-days: 7

  # EVERY SHARD RAN, AND THE GUARDS LOOKED, read across all four logs at once as ci.yml's
  # `suites-complete` does. A shard proves only that no guard SKIPPED in it; an absent SKIPPED line also
  # fits a shard that ran nothing, so the affirmative `[repo-guard] ok` is looked for here, in any shard.
  # `if: always()` with an explicit read of the result, because a skipped dependency skips a plain
  # `needs:` job, and a skipped check reads as a pass. The logs are read with `grep -a`: a Windows log
  # can carry a NUL byte, and grep then calls the file binary and prints no line from it.
  suite-complete:
    name: Driver suite on Windows, every shard
    needs: suite
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every shard ran and passed
        run: |
          echo "shards reported: ${{ needs.suite.result }}"
          [ "${{ needs.suite.result }}" = "success" ] || {
            echo '::error::the Windows suite did not come back success: it was ${{ needs.suite.result }}. A shard that was skipped or cancelled is not a shard that passed.'
            exit 1
          }

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8
        with:
          pattern: windows-suite-*
          path: logs

      - name: All four logs are present, and the guards looked
        run: |
          n=$(find logs -name suite.log | wc -l)
          echo "shard logs found: $n"
          [ "$n" -eq 4 ] || { echo "::error::expected 4 shard logs and found $n."; exit 1; }
          if grep -raF '[repo-guard] SKIPPED' logs; then
            echo '::error::a repository-scoped guard SKIPPED in one of the shards.'
            exit 1
          fi
          grep -rqaF '[repo-guard] ok' logs || {
            echo '::error::no guard in any shard reported that it read the corpus. An absent SKIPPED line is not a pass on its own: a suite that never ran prints neither marker.'
            exit 1
          }
          if grep -rqaF '[repo-guard] blocklist mode=table' logs; then
            echo '::error::a shard read the private roster: the identifier sweep reported mode=table on a public runner.'
            exit 1
          fi
          echo "the corpus guards reported ok across the Windows shards, and none skipped."
