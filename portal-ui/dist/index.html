    <!--
      The favicon, INLINE as a data URI rather than a file (#1000).

      portal-static serves exactly two things: this document, and /portal/assets/* — the hashed
      bundle output. A favicon.svg dropped in portal-ui/public/ lands at the dist ROOT, which is
      neither, so the browser would 404 it and the tab would stay blank with nothing failing
      loudly. Widening the static route to serve dist-root files to satisfy a 3 KB icon is a
      bigger change to the surface than the icon is worth.

      `img-src 'self' data:` is already in the CSP for the report renderer, so this needs no
      policy change. The mark is the BRACKET, generated from shared/brand.mjs's BRACKET_RECTS —
      #1431 retired the ridge from every surface this product renders. Keep it byte-equal to
      brand.mjs's FAVICON_LINK; driver/test/one-bracket-geometry.test.mjs asserts they agree.
    -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Crect%20x%3D%222%22%20y%3D%222.6%22%20width%3D%222%22%20height%3D%2218.8%22%20fill%3D%22%23250902%22%2F%3E%3Crect%20x%3D%222%22%20y%3D%222.6%22%20width%3D%225.6%22%20height%3D%222%22%20fill%3D%22%23250902%22%2F%3E%3Crect%20x%3D%222%22%20y%3D%2219.4%22%20width%3D%225.6%22%20height%3D%222%22%20fill%3D%22%23250902%22%2F%3E%3Crect%20x%3D%2220%22%20y%3D%222.6%22%20width%3D%222%22%20height%3D%2218.8%22%20fill%3D%22%23250902%22%2F%3E%3Crect%20x%3D%2216.4%22%20y%3D%222.6%22%20width%3D%225.6%22%20height%3D%222%22%20fill%3D%22%23250902%22%2F%3E%3Crect%20x%3D%2216.4%22%20y%3D%2219.4%22%20width%3D%225.6%22%20height%3D%222%22%20fill%3D%22%23250902%22%2F%3E%3Crect%20x%3D%2210%22%20y%3D%227.6%22%20width%3D%224%22%20height%3D%228.8%22%20fill%3D%22%23860F09%22%2F%3E%3C%2Fsvg%3E" />

    <!--
      Pre-paint theme. This runs before the stylesheet so a visitor who chose dark does not get a white
      flash first. It is a CLASSIC script, not a module: modules are deferred, and a deferred theme script
      paints the wrong theme by definition.

      The text is generated — it must match shared/portal-tokens.mjs PRE_PAINT_SCRIPT byte for byte.
      portal-service serves `script-src 'self' 'sha256-…'` computed from that same constant, so an edit
      here without an edit there means the browser silently blocks this script and everyone first-paints
      light. `node shared/tools/emit-tokens.mjs --check` (a CI stage) is what catches that.

      It reads the same `cordillera-theme` localStorage key as the report and the pool index, so a theme
      chosen anywhere in the product holds everywhere in it.
    -->
    <script>(function(){try{var t=localStorage.getItem('cordillera-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>

    <!--
      Satoshi, from Fontshare — the same source every other surface in this product uses (the report, the
      pool index, staff pages), so the portal does not render in a different face from the report embedded
      inside it.

      NOT self-hosted, deliberately and for now: no Satoshi binary exists in this repo or on the box, and
      vendoring a webfont is a licence-and-provenance decision, not a build detail. The CSP therefore
      admits api.fontshare.com for styles and fonts and NOTHING else — no script, no connect. Self-hosting
      would let that allowance go away entirely; it is worth doing, in a PR that can address the licence.
    -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="/portal/assets/index-Bjws4elh.js"></script>
    <link rel="stylesheet" crossorigin href="/portal/assets/index-C3xvWw1M.css">
